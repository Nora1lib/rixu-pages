<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2545">
  <title>时序 · 桌面悬浮窗</title>
  <link rel="stylesheet" href="./widget.css?v=24">
  <link rel="stylesheet" href="./schedule-controls.css?v=24">
  <style>
    .timeline-row{grid-template-columns:64px minmax(0,1fr) auto;gap:5px}
    .timeline-row .schedule-row-actions{grid-column:auto;justify-self:end;margin-top:0}
    .timeline-row .schedule-row-actions button{min-height:25px;padding:2px 4px}
    .timeline-row .schedule-row-actions .schedule-drag{padding:1px 7px 1px 3px}
  </style>
  <script type="module" src="./widget-runtime.js?v=24"></script>
</head>
<body data-view="today">
  <div class="sky" aria-hidden="true"></div>
  <main class="widget-shell">
    <header class="widget-header">
      <div class="date-copy"><span id="skyIcon" aria-hidden="true">🌙</span><strong id="dateLabel">今天</strong></div>
      <div class="header-actions"><button id="openFullButton" type="button" title="打开完整时序">完整页面</button><button id="collapseButton" type="button" title="收起为桌面按钮" aria-label="收起为桌面按钮">−</button></div>
    </header>
    <p id="browserHint" class="browser-hint" hidden>这是网页预览；桌面的太阳／月亮唤起按钮只会出现在 Mac 应用中。</p>
    <section class="current-card" aria-labelledby="currentHeading">
      <span class="eyebrow">✦ 当前任务</span>
      <h1 id="currentHeading">从一件小事开始</h1>
      <p id="currentMeta">写下一件想推进的事。</p>
    </section>
    <form id="quickForm" class="quick-card">
      <label for="quickInput">✎ 快速录入</label>
      <div class="quick-row"><textarea id="quickInput" rows="2" maxlength="2000" placeholder="例如：今晚八点回复邮件，预计半小时"></textarea><button id="organizeButton" type="submit">智能整理</button></div>
      <p id="captureMessage" role="status">在这里核对结果并确认入列。</p>
    </form>
    <section class="timeline-card" aria-labelledby="timelineHeading">
      <div class="timeline-head"><h2 id="timelineHeading">未来 72 小时</h2><span id="timelineCount">0 项</span></div>
      <p class="schedule-hint">拖动 ⋮⋮ 调整顺序 · 点“调整”修改时间</p>
      <div id="timelineList" class="timeline-list"></div>
    </section>
    <section id="journeyView" class="widget-page" aria-labelledby="journeyHeading">
      <h2 id="journeyHeading">长期旅程</h2><div id="widgetJourneys"></div>
      <form id="widgetJourneyForm" class="widget-inline-form"><input name="title" maxlength="80" placeholder="新旅程名称" required><select name="kind"><option value="main">主线</option><option value="side">支线</option></select><button>新建</button></form>
    </section>
    <section id="inboxView" class="widget-page" aria-labelledby="inboxHeading">
      <h2 id="inboxHeading">收纳箱</h2><div id="widgetInbox"></div>
    </section>
    <section id="settingsView" class="widget-page" aria-labelledby="settingsHeading">
      <h2 id="settingsHeading">设置</h2>
      <label>背景时间<select id="widgetTheme"><option value="auto">跟随时间</option><option value="day">白天 · 远足</option><option value="night">夜间 · 扎营</option></select></label>
      <label>临期提醒<input id="widgetReminders" type="checkbox"></label>
      <label>提醒方式<select id="widgetReminderMode"><option value="visual">渐入提示</option><option value="sound">渐入提示＋轻音</option></select></label>
      <p>设置与完整页面共用。数据导入、导出和清空请在完整页面操作。</p>
    </section>
  </main>
  <nav class="widget-nav" aria-label="悬浮窗页面">
    <button type="button" data-widget-view="today" aria-current="page"><span aria-hidden="true">⌂</span>今日</button>
    <button type="button" data-widget-view="journey"><span aria-hidden="true">⚑</span>旅程</button>
    <button type="button" data-widget-view="schedule"><span aria-hidden="true">▦</span>日程</button>
    <button type="button" data-widget-view="inbox"><span aria-hidden="true">▣</span>收纳箱</button>
    <button type="button" data-widget-view="settings"><span aria-hidden="true">⚙</span>设置</button>
  </nav>
  <div id="widgetReminder" class="widget-reminder" role="alert" hidden><strong id="widgetReminderTitle"></strong><span id="widgetReminderText"></span><button id="widgetReminderComplete" type="button" hidden>确认完成</button><button id="widgetReminderDismiss" type="button" aria-label="关闭提醒">×</button></div>
  <dialog id="widgetDeleteDialog" aria-labelledby="widgetDeleteTitle"><div class="review-shell"><h2 id="widgetDeleteTitle">确认删除</h2><p id="widgetDeleteText"></p><div class="review-actions"><button id="widgetDeleteCancel" type="button">取消</button><button id="widgetDeleteConfirm" type="button">删除</button></div></div></dialog>
  <dialog id="reviewDialog" aria-labelledby="reviewHeading">
    <div class="review-shell">
      <div class="review-head"><h2 id="reviewHeading">任务已整理好</h2><button id="closeReviewButton" type="button" aria-label="关闭核对窗口">×</button></div>
      <p id="reviewSummary"></p>
      <div id="draftList"></div>
      <div class="plan-box"><strong>时间轴预览</strong><div id="planPreview"></div></div>
      <p id="reviewMessage" role="alert"></p>
      <div class="review-actions"><button id="confirmButton" type="button">确认并入列</button><button id="cancelButton" type="button">继续修改输入</button></div>
    </div>
  </dialog>
</body>
</html>
