<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2545">
  <title>日序 · 桌面悬浮窗</title>
  <link rel="stylesheet" href="./widget.css">
  <script type="module" src="./widget.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <main class="widget-shell">
    <header class="widget-header">
      <div><span id="skyIcon" class="sky-icon" aria-hidden="true">☀️</span><strong id="dateLabel">今天</strong><p id="dateHint">把今天的一步走好</p></div>
      <button id="pinButton" class="pin-button" type="button" aria-label="切换悬浮窗置顶" title="切换置顶">◆</button>
    </header>
    <section class="current-card" aria-labelledby="currentHeading">
      <span class="eyebrow">✦ 现在先做</span>
      <h1 id="currentHeading">从一件小事开始</h1>
      <p id="currentMeta">打开日序，写下你想推进的事。</p>
      <button id="openFullButton" class="gold-button" type="button">打开完整日序 <span aria-hidden="true">›</span></button>
    </section>
    <section class="next-card" aria-labelledby="nextHeading">
      <span class="eyebrow">下一项日程</span>
      <div class="next-row"><strong id="nextHeading">还没有安排</strong><span id="nextTime"></span></div>
    </section>
    <form id="quickForm" class="quick-card">
      <label for="quickInput">✎ 快速记下</label>
      <div class="quick-row"><input id="quickInput" type="text" maxlength="500" placeholder="例如：今晚八点回复邮件" autocomplete="off"><button type="submit" aria-label="整理这件事">›</button></div>
      <p>将在完整页面智能整理，确认后才加入计划。</p>
    </form>
    <footer>日序 · 让每一步清晰可见</footer>
  </main>
</body>
</html>
